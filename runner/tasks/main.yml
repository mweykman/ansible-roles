# tasks file for runner
---
  - name: Install required packages
    apt:
      name:  "{{ item }}"
      state: present
      update_cache: yes
      loop:
        - "{{ packages }}"
      become: yes

  - name: Download GitLab Runner package
    get_url:
      url: "{{ gitlab_runner_url }}"
      dest: "{{ gitlab_runner_folder }}"
      mode: '755'

  - name: Add the user 'gitlab-runner'
    ansible.builtin.user:
      name: gitlab-runner
      comment: "GitLab Runner"
      create_home: yes
      shell: /bin/bash
      group: docker

  - name: Install #and run GitLab Runner #&& sudo gitlab-runner start
    shell: sudo gitlab-runner install --user=gitlab-runner --working-directory={{ working-directory }} 
    
  - name: Запуск сервиса gitlab-runner
    service:
      name: gitlab-runner
      state: started
      enabled: true
    become: true   

  - name: Register GitLab Runner
    command: >
      gitlab-runner register 
      --non-interactive 
      --url "{{ gitlab_runner_registration_url }}" 
      --registration-token "{{ gitlab_runner_token }}" 
      --executor "{{ gitlab_runner_executor }}" 
      --description "GitLab Runner" 
      --tag-list "{{ gitlab_runner_tags }}" 
      --run-untagged="false" 
      --locked="false"
